<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow rounded-4 p-4" style="max-width: 400px; width: 100%;">
        <div class="card-body">
            <h1 class="card-title">Hello, world!</h1>
            <p id="message"></p>
            <form>
                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="Email address">
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Password">
                </div>
                <input type="submit" class="btn btn-primary w-100" value="Нэвтрэх">
                <div class="mt-2">
                    <a href="register.html" class="btn btn-outline-secondary w-100">Бүртгүүлэх</a>
                </div>
            </form>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module">
        import { login } from './js/auth.js'

        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault()
            const email = document.querySelector('input[type="email"]').value
            const password = document.querySelector('input[type="password"]').value
            await login(email, password)
        })
    </script>
</body>

</html>
